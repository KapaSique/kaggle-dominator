name: retired-nightly-agent-validation

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate-retirement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the retired legacy surface
        run: |
          python3 -m py_compile scripts/evolution.py
          bash -n scripts/kaggle_monitor.sh scripts/kaggle_eval_loop.sh scripts/re_recon.sh
          python3 -m unittest -v tests.test_workflow_policy
