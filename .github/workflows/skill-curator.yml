name: skill-curator-validation

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate local evolution contract
        run: |
          python3 -m py_compile scripts/evolution.py
          bash -n scripts/skill_curator.sh scripts/curator_verify.sh
          python3 scripts/evolution.py status
